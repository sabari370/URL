{% extends "base.html" %}

{% block title %}Sign In - PhishGuard AI{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="text-center mb-4">
                <div class="brand-shield mb-3 d-inline-block">
                    <i class="fa-solid fa-shield-halved fa-3x text-cyan"></i>
                </div>
                <h3 class="fw-bold text-light">Welcome Back</h3>
                <p class="text-secondary small">Sign in to your PhishGuard AI account to access scan history and dashboard metrics.</p>
            </div>

            <div class="card cyber-card p-4 shadow-lg border-secondary">
                <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label text-light small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email"
                                   placeholder="analyst@domain.com" value="{{ email or '' }}" required autofocus autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-light small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password"
                                   placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-cyber-primary py-2 fw-semibold">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-dark-subtle text-secondary small">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-cyan text-decoration-none fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
